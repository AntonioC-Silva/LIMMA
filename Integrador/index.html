<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Semântica</title>

    <!-- Ícones do Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>

    <!-- CSS Externo -->
    <link rel="stylesheet" href="style..css" />
  </head>
  <body>
    <header>
      <section class="topo">
        <figure class="logo">
          <img src="logo.png" alt="Logo da Loja" />
        </figure>

        <form class="busca" action="#" method="get">
          <label for="pesquisa" class="visually-hidden">Buscar</label>
          <input
            type="search"
            name="q"
            id="pesquisa"
            placeholder="Buscar..."
          />
          <button type="submit">
            <i class="bi bi-search"></i>
          </button>
        </form>

        <section class="icones">
          <article class="icone">
            <i class="bi bi-cart3"></i>
            <p>Carrinho</p>
          </article>

          <article class="icone">
            <img src="usuario.png"alt="Ícone de usuário" class="user-icon"/>
            <p>Login/Cadastro</p>
          </article>
        </section>
      </section>
      <nav>
        <hr>
        <ul class="menu">
          <li><a href="#">Kits Upgrade</a></li>
          <li><a href="#">Gabinetes</a></li>
          <li><a href="#">Periféricos</a></li>
          <li><a href="#">Contato</a></li>
          <li><a href="#">Sobre Nós</a></li>
        </ul>
      </nav>
    </header>
        <article class="banners">
            <img src="frete.png" alt="Banner Frete gratis para todo Brasil">
            <img src="promo1.png" alt="">
        </article>

  </body>
</html>
