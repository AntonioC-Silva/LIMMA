<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cadastro</title>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="./Images/Tech (2).png" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="paginaLogin">
        <!-- Seta Voltar -->
        <header class="headerVoltar">
            <a href="produto.html" class="botaoVoltar" aria-label="Voltar para o produto">
                <i class="bi bi-arrow-left"></i>
            </a>
        </header>
        <!--Card cadastro-->
        <main class="conteudoPrincipal">
            <section class="cartaoCadastro">
                <h1 class="titulo-cadastro">Cadastro</h1>
                <!-- Campos do Formulario de cadastro Pessoais-->
                <form class="formularioCadastro">
                    <section class="grupoCampos">
                        <section class="colunaEsquerda">
                        <label class="labelCampo">Nome</label>
                        <input type="text" class="campoInput" placeholder="Nome completo"  />

                        <label class="labelCampo">Email</label>
                        <input type="email" class="campoInput" placeholder="Email" />

                        <label class="labelCampo">Contato</label>
                        <input type="tel" class="campoInput" placeholder="(xx)xxxxx-xxxx" />

                        <label class="labelCampo">CPF</label>
                        <input type="text" class="campoInput" placeholder="CPF" />

                        <label class="labelCampo">Senha</label>
                        <input type="password" class="campoInput" placeholder="Senha" />

                        <label class="labelCampo">Confirmar Senha</label>
                        <input type="password" class="campoInput" placeholder="Confirme sua senha" />
                    </section>

                    <!--Divisoria no card-->
                    <div class="divisoriaVertical" aria-hidden="true"></div>

                    <!-- Campos do Formulario de cadastro Endereço-->
                    <section class="colunaDireita">
                        <label class="labelCampo">CEP</label>
                        <input type="text" class="campoInput" placeholder="CEP" />

                        <section class="linhaCidadeUf">
                            <section class="campoCidade">
                                <label class="labelCampo">Cidade</label>
                                <input type="text" class="campoInput" placeholder="Cidade" />
                            </section>

                            <section class="campoUf">
                                <label class="labelCampo">UF</label>
                                <select class="campoInput ufSelect" >
                                    <option value="UF">UF</option>
                                    <option value="AC">AC</option>
                                    <option value="AL">AL</option>
                                    <option value="AP">AP</option>
                                    <option value="AM">AM</option>
                                    <option value="BA">BA</option>
                                    <option value="CE">CE</option>
                                    <option value="DF">DF</option>
                                    <option value="ES">ES</option>
                                    <option value="GO">GO</option>
                                    <option value="MA">MA</option>
                                    <option value="MT">MT</option>
                                    <option value="MS">MS</option>
                                    <option value="MG">MG</option>
                                    <option value="PA">PA</option>
                                    <option value="PB">PB</option>
                                    <option value="PR">PR</option>
                                    <option value="PE">PE</option>
                                    <option value="PI">PI</option>
                                    <option value="RJ">RJ</option>
                                    <option value="RN">RN</option>
                                    <option value="RS">RS</option>
                                    <option value="RO">RO</option>
                                    <option value="RR">RR</option>
                                    <option value="SC">SC</option>
                                    <option value="SP">SP</option>
                                    <option value="SE">SE</option>
                                    <option value="TO">TO</option>
                                </select>
                            </section>
                        </section>

                        <label class="labelCampo">Bairro</label>
                        <input type="text"  class="campoInput" placeholder="Bairro" />

                        <label class="labelCampo">Número</label>
                        <input type="text"  class="campoInput" placeholder="Número" />

                        <label class="labelCampo">Complemento</label>
                        <input type="text" class="campoInput" placeholder="Complemento" />
                        </section>
                    </section>

                    <section class="areaBotao">
                        <a href="login.html" class="botaoCadastrar">Cadastrar</a>
                    </section>
                </form>
            </section>
        </main>
    </body>
</html>
